<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EARNED AUTONOMY — BrightLoop Support Ops</title>
<style>
  :root {
    --bg: #0d0f14;
    --bg2: #13161e;
    --bg3: #1a1e28;
    --border: #2a2f3f;
    --text: #c8d0e0;
    --text-dim: #5a6278;
    --text-bright: #e8eaf0;
    --mono: 'Courier New', Courier, monospace;
    --green: #2ecc71;
    --green-dim: #1a4a2e;
    --amber: #f39c12;
    --amber-dim: #3d2800;
    --blue: #3498db;
    --blue-dim: #0a2030;
    --grey: #555e72;
    --grey-dim: #1e2028;
    --red: #e74c3c;
    --red-dim: #3d0a08;
    --purple: #9b59b6;
    --purple-dim: #2a1040;
    --accent: #00d4aa;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; }

  /* HEADER */
  #header {
    padding: 10px 18px 8px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    display: flex; align-items: baseline; gap: 16px;
  }
  #header h1 { font-size: 15px; color: var(--accent); letter-spacing: 2px; }
  #header .tagline { color: var(--text-dim); font-size: 11px; }

  /* ACTION BAR */
  #action-bar {
    padding: 8px 18px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start;
  }
  .job-block { display: flex; flex-direction: column; gap: 4px; }
  .job-btn {
    background: var(--bg3); color: var(--text-bright);
    border: 1px solid var(--border); padding: 5px 12px;
    cursor: pointer; font-family: var(--mono); font-size: 12px;
    letter-spacing: 1px;
    transition: border-color .15s, background .15s;
  }
  .job-btn:hover { border-color: var(--accent); background: #161b25; }
  .job-btn.running { border-color: var(--amber); color: var(--amber); animation: pulse 1s infinite; }
  .job-btn.done { border-color: var(--green); color: var(--green); }
  .job-btn.error { border-color: var(--red); color: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  .job-output-wrap { display: none; }
  .job-output-wrap.visible { display: block; }
  .job-output-toggle {
    font-size: 10px; color: var(--text-dim); cursor: pointer;
    text-decoration: underline; padding-left: 2px;
  }
  .job-output-toggle:hover { color: var(--accent); }
  .job-output {
    font-size: 10px; background: var(--bg); color: var(--text-dim);
    border: 1px solid var(--border); padding: 6px 8px;
    max-height: 140px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-all;
    width: 320px;
  }

  /* LAYOUT */
  #main {
    display: grid;
    grid-template-columns: 360px 1fr;
    grid-template-rows: 1fr auto;
    height: calc(100vh - 90px);
    gap: 0;
  }
  #chat-pane {
    grid-row: 1 / 3;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  #ledger-pane {
    grid-row: 1;
    overflow-y: auto;
    border-bottom: 1px solid var(--border);
    padding: 12px;
  }
  #bottom-pane {
    grid-row: 2;
    overflow-y: auto;
    max-height: 340px;
    padding: 12px;
  }

  /* PANE HEADERS */
  .pane-title {
    font-size: 10px; letter-spacing: 2px; color: var(--text-dim);
    text-transform: uppercase; padding: 8px 12px 6px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
  }

  /* CHAT */
  #chat-messages {
    flex: 1; overflow-y: auto; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .msg { max-width: 100%; }
  .msg-user { align-self: flex-end; }
  .msg-agent { align-self: flex-start; }
  .msg-bubble {
    padding: 6px 10px; border-radius: 2px;
    font-size: 12px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg-user .msg-bubble { background: var(--blue-dim); border-left: 3px solid var(--blue); }
  .msg-agent .msg-bubble { background: var(--bg3); border-left: 3px solid var(--accent); }
  .msg-trace { font-size: 10px; color: var(--text-dim); padding: 2px 10px; }
  .msg-trace a { color: var(--accent); text-decoration: none; }
  .msg-trace a:hover { text-decoration: underline; }
  #chat-input-row {
    display: flex; gap: 0; border-top: 1px solid var(--border); padding: 8px;
  }
  #chat-input {
    flex: 1; background: var(--bg3); color: var(--text-bright);
    border: 1px solid var(--border); padding: 6px 8px;
    font-family: var(--mono); font-size: 12px; resize: none; height: 48px;
  }
  #chat-input:focus { outline: none; border-color: var(--accent); }
  #chat-send {
    background: var(--accent); color: #000; border: none;
    padding: 0 14px; cursor: pointer; font-family: var(--mono); font-size: 12px;
    font-weight: bold; letter-spacing: 1px;
    transition: opacity .15s;
  }
  #chat-send:hover { opacity: .85; }
  #chat-send:disabled { opacity: .4; cursor: default; }

  /* LEDGER CARDS */
  .ledger-cards { display: flex; flex-direction: column; gap: 8px; }
  .ledger-card {
    background: var(--bg3); border: 1px solid var(--border);
    padding: 10px 12px;
  }
  .ledger-card.demoted { border-color: var(--red); animation: flashred .8s 2; }
  @keyframes flashred {
    0%,100%{ background: var(--bg3); }
    50%{ background: var(--red-dim); }
  }
  .ledger-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .action-label { color: var(--text-bright); font-size: 13px; letter-spacing: 1px; flex: 1; }
  .tier-badge {
    font-size: 10px; padding: 2px 8px; letter-spacing: 1px;
    border-radius: 2px; white-space: nowrap;
  }
  .tier-badge.t0 { background: var(--grey-dim); color: var(--grey); border: 1px solid var(--grey); }
  .tier-badge.t1 { background: var(--amber-dim); color: var(--amber); border: 1px solid var(--amber); }
  .tier-badge.t2 { background: var(--blue-dim); color: var(--blue); border: 1px solid var(--blue); }
  .tier-badge.t3 { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); }
  .demoted-badge {
    font-size: 10px; background: var(--red-dim); color: var(--red);
    border: 1px solid var(--red); padding: 2px 6px; letter-spacing: 1px;
  }
  .pass-bar-wrap { height: 4px; background: var(--border); margin-bottom: 5px; }
  .pass-bar { height: 4px; background: var(--accent); transition: width .4s; }
  .ledger-meta { font-size: 10px; color: var(--text-dim); line-height: 1.6; }
  .ledger-meta .hint { color: var(--amber); }
  .ledger-meta .reason { color: var(--text-dim); font-style: italic; word-break: break-word; }

  /* EVAL SUMMARY */
  .eval-summary { margin-top: 12px; }
  .eval-summary-title { font-size: 10px; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 4px; }
  .eval-table { width: 100%; border-collapse: collapse; font-size: 10px; }
  .eval-table th { color: var(--text-dim); text-align: left; padding: 2px 6px; border-bottom: 1px solid var(--border); }
  .eval-table td { padding: 2px 6px; border-bottom: 1px solid #1a1e28; }
  .eval-pass { color: var(--green); }
  .eval-fail { color: var(--red); }

  /* APPROVAL QUEUE */
  #bottom-pane { display: flex; flex-direction: column; gap: 12px; }
  .section-title { font-size: 10px; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 6px; }
  .proposal-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .proposal-table th { color: var(--text-dim); text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--border); font-size: 10px; }
  .proposal-table td { padding: 4px 6px; vertical-align: top; border-bottom: 1px solid #1a1e28; }
  .proposal-table tr.resolved td { color: var(--text-dim); opacity: .6; }
  .kind-chip {
    font-size: 9px; padding: 1px 5px; border-radius: 2px; white-space: nowrap;
    letter-spacing: 1px;
  }
  .kind-action { background: var(--amber-dim); color: var(--amber); border: 1px solid var(--amber); }
  .kind-tier { background: var(--purple-dim); color: var(--purple); border: 1px solid var(--purple); }
  .status-chip {
    font-size: 9px; padding: 1px 5px; border-radius: 2px;
    letter-spacing: 1px;
  }
  .status-pending { color: var(--amber); }
  .status-approved { color: var(--green); }
  .status-rejected { color: var(--red); }
  .status-executed { color: var(--blue); }
  .trace-link { color: var(--accent); font-size: 10px; text-decoration: none; }
  .trace-link:hover { text-decoration: underline; }
  .btn-approve, .btn-reject {
    font-family: var(--mono); font-size: 10px; padding: 2px 8px;
    cursor: pointer; border: 1px solid; border-radius: 2px; letter-spacing: 1px;
    transition: opacity .15s;
  }
  .btn-approve { background: var(--green-dim); color: var(--green); border-color: var(--green); }
  .btn-approve:hover { opacity: .8; }
  .btn-reject { background: var(--red-dim); color: var(--red); border-color: var(--red); }
  .btn-reject:hover { opacity: .8; }

  /* ACTIVITY */
  .activity-list { display: flex; flex-direction: column; gap: 4px; }
  .activity-row {
    display: flex; gap: 8px; align-items: baseline; font-size: 11px;
    padding: 3px 6px; background: var(--bg3); border-left: 3px solid var(--border);
  }
  .activity-row.decision-executed { border-color: var(--green); }
  .activity-row.decision-proposed { border-color: var(--amber); }
  .activity-row.decision-confirm  { border-color: var(--blue); }
  .activity-row.decision-blocked  { border-color: var(--red); }
  .activity-decision { font-size: 10px; width: 68px; flex-shrink: 0; letter-spacing: 1px; }
  .activity-at { color: var(--text-dim); font-size: 10px; margin-left: auto; }

  /* SCROLLBARS */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div id="header">
  <h1>EARNED AUTONOMY &mdash; BrightLoop Support Ops</h1>
  <span class="tagline">Permissions are earned, not configured.</span>
</div>

<div id="action-bar">
  <!-- job blocks injected by JS -->
</div>

<div id="main">
  <!-- LEFT: Chat -->
  <div id="chat-pane">
    <div class="pane-title">CHAT &mdash; Support Agent</div>
    <div id="chat-messages"></div>
    <div id="chat-input-row">
      <textarea id="chat-input" placeholder="Type a support request… (Shift+Enter = newline)"></textarea>
      <button id="chat-send">SEND</button>
    </div>
  </div>

  <!-- RIGHT TOP: Ledger + Evals -->
  <div id="ledger-pane">
    <div class="pane-title">AUTONOMY LEDGER</div>
    <div class="ledger-cards" id="ledger-cards"><!-- rendered by JS --></div>
  </div>

  <!-- RIGHT BOTTOM: Queue + Activity -->
  <div id="bottom-pane">
    <div>
      <div class="section-title">Approval Queue</div>
      <table class="proposal-table">
        <thead>
          <tr>
            <th>KIND</th><th>ACTION</th><th>SUMMARY</th><th>EVIDENCE</th><th>STATUS</th><th>ACTIONS</th>
          </tr>
        </thead>
        <tbody id="proposals-tbody"><!-- rendered by JS --></tbody>
      </table>
    </div>
    <div>
      <div class="section-title">Recent Activity</div>
      <div class="activity-list" id="activity-list"><!-- rendered by JS --></div>
    </div>
  </div>
</div>

<script>
// ---- Utilities ----
function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function fmtTime(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return d.toLocaleTimeString();
  } catch(e) { return iso; }
}

function fmtPayload(payload, kind) {
  try {
    const p = typeof payload === 'string' ? JSON.parse(payload) : payload;
    if (kind === 'tier_change') {
      return `T${p.from_tier} → T${p.to_tier}: ${p.rationale || ''}`.slice(0, 80);
    }
    return Object.entries(p).map(([k,v]) => `${k}=${JSON.stringify(v)}`).join(' ').slice(0,80);
  } catch(e) {
    return String(payload).slice(0,80);
  }
}

// ---- Job buttons ----
const JOBS = [
  { id:'seed',    label:'Seed DB' },
  { id:'day',     label:'Run clean day (6)' },
  { id:'traps',   label:'Run trap day (2)' },
  { id:'evals',   label:'Run evals' },
  { id:'reflect', label:'Run reflection' },
];

function initActionBar() {
  const bar = document.getElementById('action-bar');
  bar.innerHTML = '';
  for (const j of JOBS) {
    const block = document.createElement('div');
    block.className = 'job-block';
    block.id = `job-block-${j.id}`;

    const btn = document.createElement('button');
    btn.className = 'job-btn';
    btn.id = `job-btn-${j.id}`;
    btn.textContent = j.label;
    btn.onclick = () => startJob(j.id);
    block.appendChild(btn);

    const toggle = document.createElement('div');
    toggle.className = 'job-output-toggle';
    toggle.id = `job-toggle-${j.id}`;
    toggle.textContent = 'show output';
    toggle.style.display = 'none';
    toggle.onclick = () => toggleOutput(j.id);
    block.appendChild(toggle);

    const wrap = document.createElement('div');
    wrap.className = 'job-output-wrap';
    wrap.id = `job-output-wrap-${j.id}`;
    const pre = document.createElement('pre');
    pre.className = 'job-output';
    pre.id = `job-output-${j.id}`;
    wrap.appendChild(pre);
    block.appendChild(wrap);

    bar.appendChild(block);
  }
}

function toggleOutput(id) {
  const wrap = document.getElementById(`job-output-wrap-${id}`);
  const tog = document.getElementById(`job-toggle-${id}`);
  if (wrap.classList.contains('visible')) {
    wrap.classList.remove('visible');
    tog.textContent = 'show output';
  } else {
    wrap.classList.add('visible');
    tog.textContent = 'hide output';
  }
}

async function startJob(id) {
  const btn = document.getElementById(`job-btn-${id}`);
  btn.disabled = true;
  try {
    const resp = await fetch(`/api/run/${id}`, {method:'POST'});
    if (!resp.ok) {
      const err = await resp.json().catch(()=>({detail:'error'}));
      alert(`Job ${id}: ${err.detail || 'failed'}`);
    }
  } finally {
    btn.disabled = false;
  }
}

function updateJobButtons(jobs) {
  for (const {id} of JOBS) {
    const state = jobs[id];
    if (!state) continue;
    const btn = document.getElementById(`job-btn-${id}`);
    const toggle = document.getElementById(`job-toggle-${id}`);
    const pre = document.getElementById(`job-output-${id}`);
    if (!btn) continue;

    btn.classList.remove('running','done','error');
    if (state.status === 'running') {
      btn.classList.add('running');
      btn.disabled = true;
    } else if (state.status === 'done') {
      btn.classList.add('done');
      btn.disabled = false;
    } else if (state.status === 'error') {
      btn.classList.add('error');
      btn.disabled = false;
    } else {
      btn.disabled = false;
    }

    if (state.output) {
      pre.textContent = state.output;
      toggle.style.display = 'block';
    }
  }
}

// ---- Ledger rendering ----
const TIER_CLASS = ['t0','t1','t2','t3'];
const TIER_COLOR = ['var(--grey)','var(--amber)','var(--blue)','var(--green)'];

function renderLedger(ledger, evalSummary) {
  const container = document.getElementById('ledger-cards');
  // build eval map: action_type -> [{eval_name, passes, total}]
  const evalMap = {};
  for (const e of (evalSummary||[])) {
    if (!evalMap[e.action_type]) evalMap[e.action_type] = [];
    evalMap[e.action_type].push(e);
  }

  let html = '';
  for (const row of ledger) {
    const tier = row.tier || 0;
    const tierClass = TIER_CLASS[tier] || 't0';
    const tierName = row.tier_name || `T${tier}`;
    const passRate = row.pass_rate;
    const barPct = passRate != null ? Math.round(passRate * 100) : 0;
    const sampleCount = row.sample_count || 0;
    const reason = row.last_change_reason || '';
    const isDemoted = reason.toLowerCase().includes('demot');

    const promoteRate = row.promote_min_pass_rate;
    const promoteSamples = row.promote_min_samples;
    let hintHtml = '';
    if (promoteRate != null) {
      hintHtml = `<span class="hint">next tier: &ge;${Math.round(promoteRate*100)}% over &ge;${promoteSamples} samples</span>`;
    } else if (tier >= 3) {
      hintHtml = `<span style="color:var(--green)">max tier</span>`;
    }

    // Eval rows for this action type
    const evals = evalMap[row.action_type] || [];
    let evalRowsHtml = '';
    for (const e of evals) {
      const pct = e.total > 0 ? Math.round((e.passes/e.total)*100) : 0;
      const cls = pct >= 90 ? 'eval-pass' : 'eval-fail';
      evalRowsHtml += `<tr>
        <td style="padding-left:0">${esc(e.eval_name)}</td>
        <td class="${cls}">${e.passes}/${e.total} (${pct}%)</td>
      </tr>`;
    }
    const evalHtml = evals.length > 0 ? `
      <table class="eval-table" style="margin-top:5px">
        <thead><tr><th>eval</th><th>pass/total</th></tr></thead>
        <tbody>${evalRowsHtml}</tbody>
      </table>` : '';

    html += `
    <div class="ledger-card${isDemoted?' demoted':''}">
      <div class="ledger-card-top">
        <span class="action-label">${esc(row.action_type.toUpperCase())}</span>
        ${isDemoted ? '<span class="demoted-badge">DEMOTED</span>' : ''}
        <span class="tier-badge ${tierClass}">${esc(tierName)}</span>
      </div>
      <div class="pass-bar-wrap">
        <div class="pass-bar" style="width:${barPct}%"></div>
      </div>
      <div class="ledger-meta">
        ${passRate != null ? `pass rate: <strong>${barPct}%</strong> &nbsp;` : 'pass rate: n/a &nbsp;'}
        samples: <strong>${sampleCount}</strong>
        ${hintHtml ? '<br>' + hintHtml : ''}
        ${reason ? `<br><span class="reason">${esc(reason)}</span>` : ''}
      </div>
      ${evalHtml}
    </div>`;
  }
  container.innerHTML = html;
}

// ---- Proposals rendering ----
let _phoenixBase = '';

function renderProposals(proposals) {
  const tbody = document.getElementById('proposals-tbody');
  if (!proposals || proposals.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="color:var(--text-dim);padding:8px 6px">No proposals</td></tr>';
    return;
  }
  let html = '';
  for (const p of proposals) {
    const isPending = p.status === 'pending';
    const kindChip = p.kind === 'tier_change'
      ? '<span class="kind-chip kind-tier">TIER CHANGE</span>'
      : '<span class="kind-chip kind-action">ACTION</span>';

    const summary = esc(fmtPayload(p.payload, p.kind));

    // Evidence trace links
    let evidenceHtml = '';
    try {
      const ev = typeof p.evidence === 'string' ? JSON.parse(p.evidence) : (p.evidence||{});
      const tids = ev.trace_ids || [];
      evidenceHtml = tids.slice(0,3).map(tid =>
        `<a class="trace-link" href="${esc(_phoenixBase)}/projects" target="_blank" title="${esc(tid)}">${esc(String(tid).slice(0,8))}…</a>`
      ).join(' ');
    } catch(e) {}
    if (!evidenceHtml && p.trace_id) {
      evidenceHtml = `<a class="trace-link" href="${esc(_phoenixBase)}/projects" target="_blank" title="${esc(p.trace_id)}">${esc(String(p.trace_id).slice(0,8))}…</a>`;
    }

    const statusHtml = `<span class="status-chip status-${esc(p.status)}">${esc(p.status)}</span>`;
    const actionsHtml = isPending
      ? `<button class="btn-approve" onclick="approveProposal(${p.id})">Approve</button>
         <button class="btn-reject" onclick="rejectProposal(${p.id})" style="margin-left:4px">Reject</button>`
      : '';

    html += `<tr class="${isPending?'':'resolved'}">
      <td>${kindChip}</td>
      <td>${esc(p.action_type)}</td>
      <td>${summary}</td>
      <td>${evidenceHtml}</td>
      <td>${statusHtml}</td>
      <td>${actionsHtml}</td>
    </tr>`;
  }
  tbody.innerHTML = html;
}

async function approveProposal(id) {
  const resp = await fetch(`/api/proposals/${id}/approve`, {method:'POST'});
  if (!resp.ok) {
    const e = await resp.json().catch(()=>({detail:'error'}));
    alert(`Approve failed: ${e.detail}`);
  }
}

async function rejectProposal(id) {
  const resp = await fetch(`/api/proposals/${id}/reject`, {method:'POST'});
  if (!resp.ok) {
    const e = await resp.json().catch(()=>({detail:'error'}));
    alert(`Reject failed: ${e.detail}`);
  }
}

// ---- Activity rendering ----
function renderActivity(executions) {
  const list = document.getElementById('activity-list');
  if (!executions || executions.length === 0) {
    list.innerHTML = '<div style="color:var(--text-dim);font-size:11px;padding:4px 6px">No activity yet</div>';
    return;
  }
  let html = '';
  for (const ex of executions) {
    const dec = ex.decision || 'unknown';
    html += `<div class="activity-row decision-${esc(dec)}">
      <span class="activity-decision" style="color:${decisionColor(dec)}">${esc(dec.toUpperCase())}</span>
      <span>${esc(ex.action_type)}</span>
      <span class="activity-at">${fmtTime(ex.created_at)}</span>
    </div>`;
  }
  list.innerHTML = html;
}

function decisionColor(d) {
  return {executed:'var(--green)',proposed:'var(--amber)',confirm:'var(--blue)',blocked:'var(--red)'}[d]||'var(--text-dim)';
}

// ---- State polling ----
let _lastLedger = null;

async function pollState() {
  try {
    const r = await fetch('/api/state');
    if (!r.ok) return;
    const state = await r.json();
    renderLedger(state.ledger, state.eval_summary);
    renderProposals(state.proposals);
    renderActivity(state.executions);
  } catch(e) {}
}

async function pollJobs() {
  try {
    const r = await fetch('/api/jobs');
    if (!r.ok) return;
    const jobs = await r.json();
    updateJobButtons(jobs);
  } catch(e) {}
}

// ---- Chat ----
let _sessionId = null;
let _chatSending = false;

function appendMessage(role, text, traceId, phoenixUrl) {
  const container = document.getElementById('chat-messages');
  const wrap = document.createElement('div');
  wrap.className = `msg msg-${role}`;

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;  // safe: textContent not innerHTML
  wrap.appendChild(bubble);

  if (traceId && phoenixUrl) {
    const traceDiv = document.createElement('div');
    traceDiv.className = 'msg-trace';
    const a = document.createElement('a');
    a.href = phoenixUrl;
    a.target = '_blank';
    a.textContent = 'trace ↗';
    traceDiv.appendChild(a);
    wrap.appendChild(traceDiv);
  }
  container.appendChild(wrap);
  container.scrollTop = container.scrollHeight;
}

async function sendChat() {
  if (_chatSending) return;
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;

  _chatSending = true;
  document.getElementById('chat-send').disabled = true;
  input.value = '';

  appendMessage('user', msg, null, null);

  try {
    const body = {message: msg};
    if (_sessionId) body.session_id = _sessionId;
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    _sessionId = data.session_id || _sessionId;
    _phoenixBase = (data.phoenix_url || '').replace('/projects','');
    appendMessage('agent', data.reply || '(no reply)', data.trace_id, data.phoenix_url);
  } catch(e) {
    appendMessage('agent', `[error: ${e.message}]`, null, null);
  } finally {
    _chatSending = false;
    document.getElementById('chat-send').disabled = false;
    input.focus();
  }
}

document.getElementById('chat-send').addEventListener('click', sendChat);
document.getElementById('chat-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
});

// ---- Init ----
initActionBar();
pollState();
pollJobs();
setInterval(pollState, 2500);
setInterval(pollJobs, 1500);
</script>
