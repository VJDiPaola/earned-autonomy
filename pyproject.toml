[project]
name = "earned-autonomy"
version = "0.1.0"
description = "Customer-support agent whose permissions are earned, not configured — autonomy tiers computed from LLM-as-a-Judge evals on its own Phoenix traces"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "openinference-instrumentation-google-adk>=0.1.11",
    "google-adk>=1.32.0",
    "google-genai>=1.9.0",
    "python-dotenv>=1.0.1",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "arize-phoenix>=7.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "pandas>=2.0",
    "httpx>=0.27",
]
